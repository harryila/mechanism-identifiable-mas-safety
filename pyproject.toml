[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mechanism-identifiable-mas-safety"
version = "0.1.0"
description = "A controlled harness for mechanism-identifiable compositional safety experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mechanism-Identifiable MAS Safety contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/harryila/mechanism-identifiable-mas-safety"
Issues = "https://github.com/harryila/mechanism-identifiable-mas-safety/issues"

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8.0"]
notebook = ["jupyter>=1.1", "nbclient>=0.10", "nbformat>=5.10"]

[project.scripts]
mas-safety = "mas_safety.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mas_safety"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "mas_safety/scenarios"
"schemas" = "mas_safety/schemas"
"manifests" = "mas_safety/manifests"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
