<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202124}.title{font-size:20px;font-weight:700}.role{font-size:14px;font-weight:700}.mechanism{font-size:12px;font-weight:700}.coordinate{font-size:10px;fill:#475569}</style>
<text class="title" x="24" y="34">Fixed workflow and preregistered intervention coordinates</text>
<rect x="35" y="82" width="135" height="54" rx="8" fill="#ffffff" stroke="#64748b"/>
<text class="role" text-anchor="middle" x="102.5" y="115">Planner</text>
<line x1="170" y1="109" x2="195" y2="109" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="82" width="135" height="54" rx="8" fill="#ffffff" stroke="#64748b"/>
<text class="role" text-anchor="middle" x="272.5" y="115">Retriever</text>
<line x1="340" y1="109" x2="365" y2="109" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="375" y="82" width="135" height="54" rx="8" fill="#ffffff" stroke="#64748b"/>
<text class="role" text-anchor="middle" x="442.5" y="115">Transformer</text>
<line x1="510" y1="109" x2="535" y2="109" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="545" y="82" width="135" height="54" rx="8" fill="#ffffff" stroke="#64748b"/>
<text class="role" text-anchor="middle" x="612.5" y="115">Actuator</text>
<line x1="680" y1="109" x2="705" y2="109" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="715" y="82" width="135" height="54" rx="8" fill="#ffffff" stroke="#64748b"/>
<text class="role" text-anchor="middle" x="782.5" y="115">Simulator</text>
<line x1="102.5" y1="136" x2="102.5" y2="184" stroke="#64748b" stroke-dasharray="4 3"/>
<rect x="35" y="184" width="155" height="76" rx="8" fill="#dbeafe" stroke="#94a3b8"/>
<text class="mechanism" text-anchor="middle" x="112.5" y="210">Intent decomposition</text>
<text class="coordinate" text-anchor="middle" x="112.5" y="232">objective_projection_mode</text>
<text class="coordinate" text-anchor="middle" x="112.5" y="248">off → on at this coordinate</text>
<line x1="272.5" y1="136" x2="272.5" y2="184" stroke="#64748b" stroke-dasharray="4 3"/>
<rect x="205" y="184" width="155" height="76" rx="8" fill="#dcfce7" stroke="#94a3b8"/>
<text class="mechanism" text-anchor="middle" x="282.5" y="210">Context fragmentation</text>
<text class="coordinate" text-anchor="middle" x="282.5" y="232">fact_routing_mode</text>
<text class="coordinate" text-anchor="middle" x="282.5" y="248">off → on at this coordinate</text>
<line x1="442.5" y1="136" x2="442.5" y2="184" stroke="#64748b" stroke-dasharray="4 3"/>
<rect x="375" y="184" width="155" height="76" rx="8" fill="#fef3c7" stroke="#94a3b8"/>
<text class="mechanism" text-anchor="middle" x="452.5" y="210">Authorization drift</text>
<text class="coordinate" text-anchor="middle" x="452.5" y="232">authorization_information_forwarded</text>
<text class="coordinate" text-anchor="middle" x="452.5" y="248">off → on at this coordinate</text>
<line x1="612.5" y1="136" x2="612.5" y2="184" stroke="#64748b" stroke-dasharray="4 3"/>
<rect x="545" y="184" width="155" height="76" rx="8" fill="#fce7f3" stroke="#94a3b8"/>
<text class="mechanism" text-anchor="middle" x="622.5" y="210">Policy heterogeneity</text>
<text class="coordinate" text-anchor="middle" x="622.5" y="232">policy_assignment_by_role.actuator</text>
<text class="coordinate" text-anchor="middle" x="622.5" y="248">off → on at this coordinate</text>
<text class="coordinate" x="24" y="295">Each treatment changes one declared coordinate from its matched mechanism-off control.</text>
<text class="coordinate" x="24" y="312">The Simulator applies the deterministic terminal-state evaluator after the Actuator.</text>
</svg>
